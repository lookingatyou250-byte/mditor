<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标题高亮测试</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-content {
            font-size: 16px;
            line-height: 1.8;
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1, h2, h3 {
            margin: 16px 0 8px 0;
        }
        p {
            margin: 8px 0;
        }
        mark.temp-highlight {
            padding: 2px 0;
            border-radius: 2px;
        }
        mark[data-highlight-color="amber"] {
            background-color: rgba(251, 191, 36, 0.3);
        }
        .instructions {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>标题高亮 Bug 测试</h1>

    <div class="instructions">
        <h2>测试场景：</h2>
        <p>下面的内容包含一个 h2 标题，尝试高亮整段内容（包括标题）。</p>
        <ol>
            <li>选中下面整段文字（从"功能特色"到"暗色主题"）</li>
            <li>点击"应用高亮"按钮</li>
            <li>观察是否成功高亮</li>
        </ol>
    </div>

    <div class="test-content" id="content">
<h2>功能特色</h2>
<p>无边框窗口 - 沉浸式写作体验</p>
<p>实时自动保存 - 2秒无操作自动保存</p>
<p>聚焦模式 - 点击右上角靶心图标，专注当前段落</p>
<p>暗色主题 - 点击右上角月亮/太阳图标切换</p>
    </div>

    <div style="margin-bottom: 20px;">
        <button onclick="applyHighlight()" style="background: rgba(251, 191, 36, 0.5); padding: 10px 20px; margin: 5px;">应用高亮</button>
        <button onclick="clearAll()" style="background: #fff; padding: 10px 20px; margin: 5px; border: 1px solid #ccc;">清除所有</button>
    </div>

    <div id="log" style="background: #f9f9f9; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 400px; overflow-y: auto;"></div>

    <script>
        function log(message) {
            const logEl = document.getElementById('log');
            logEl.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            logEl.scrollTop = logEl.scrollHeight;
        }

        function applyHighlight() {
            const selection = window.getSelection();
            if (!selection || selection.rangeCount === 0) {
                log('❌ 没有选中文本');
                return;
            }

            const range = selection.getRangeAt(0);
            if (range.collapsed) {
                log('❌ 选区为空');
                return;
            }

            const selectedText = range.toString();
            log('📝 选中文本长度: ' + selectedText.length + ' 字符');
            log('📝 选中文本前50字符: "' + selectedText.substring(0, 50) + '..."');

            const contentArea = document.getElementById('content');

            log('🔍 commonAncestorContainer: ' + range.commonAncestorContainer.nodeName);
            log('🔍 startContainer: ' + range.startContainer.nodeName + ' (offset: ' + range.startOffset + ')');
            log('🔍 endContainer: ' + range.endContainer.nodeName + ' (offset: ' + range.endOffset + ')');

            // 关键检查：选区是否在内容区域内
            const isContained = contentArea.contains(range.commonAncestorContainer);
            log('🔍 contentArea.contains(commonAncestor): ' + isContained);

            if (!isContained) {
                log('❌ 选区不在内容区域内 - 这是 BUG 的原因！');
                return;
            }

            // 检查是否跨越了块级元素
            const startElement = range.startContainer.nodeType === Node.TEXT_NODE
                ? range.startContainer.parentElement
                : range.startContainer;
            const endElement = range.endContainer.nodeType === Node.TEXT_NODE
                ? range.endContainer.parentElement
                : range.endContainer;

            log('🔍 startElement: ' + startElement.tagName);
            log('🔍 endElement: ' + endElement.tagName);

            if (startElement !== endElement) {
                log('⚠️  选区跨越了多个元素');
            }

            // 尝试应用高亮
            const savedText = range.toString();
            const color = 'amber';

            // 获取共同祖先
            let commonParent = range.commonAncestorContainer;
            if (commonParent.nodeType === Node.TEXT_NODE) {
                commonParent = commonParent.parentNode;
            }
            log('🔍 commonParent 用于查找: ' + commonParent.nodeName);

            // 基于保存的文本内容重新创建选区
            const findTextRange = (parent, targetText) => {
                const fullText = parent.textContent;
                log('🔍 父元素全文长度: ' + fullText.length);

                const startIndex = fullText.indexOf(targetText);

                if (startIndex === -1) {
                    log('❌ 无法找到文本');
                    return null;
                }

                log('✅ 找到文本，起始位置: ' + startIndex);

                const endIndex = startIndex + targetText.length;
                const newRange = document.createRange();

                const walker = document.createTreeWalker(
                    parent,
                    NodeFilter.SHOW_TEXT,
                    null
                );

                let currentOffset = 0;
                let startSet = false;
                let node;
                let nodeCount = 0;

                while (node = walker.nextNode()) {
                    nodeCount++;
                    const nodeLength = node.textContent.length;
                    const nodeEnd = currentOffset + nodeLength;

                    if (!startSet && currentOffset <= startIndex && startIndex < nodeEnd) {
                        newRange.setStart(node, startIndex - currentOffset);
                        startSet = true;
                        log('✅ 设置起点在第 ' + nodeCount + ' 个文本节点');
                    }

                    if (startSet && currentOffset < endIndex && endIndex <= nodeEnd) {
                        newRange.setEnd(node, endIndex - currentOffset);
                        log('✅ 设置终点在第 ' + nodeCount + ' 个文本节点');
                        return newRange;
                    }

                    currentOffset = nodeEnd;
                }

                log('❌ 遍历了 ' + nodeCount + ' 个文本节点，但未能完整设置选区');
                return null;
            };

            const newRange = findTextRange(commonParent, savedText);
            if (!newRange) {
                log('❌ 无法重新创建选区');
                return;
            }

            log('✅ 成功重新创建选区');

            // 创建并应用新高亮
            const mark = document.createElement('mark');
            mark.className = 'temp-highlight';
            mark.dataset.highlightColor = color;

            try {
                newRange.surroundContents(mark);
                log('✅ 成功应用高亮（surroundContents）');
            } catch (e) {
                log('⚠️  surroundContents 失败: ' + e.message);
                log('⚠️  尝试使用 extractContents');
                try {
                    const fragment = newRange.extractContents();
                    mark.appendChild(fragment);
                    newRange.insertNode(mark);
                    log('✅ 成功应用高亮（extractContents）');
                } catch (e2) {
                    log('❌ extractContents 也失败: ' + e2.message);
                    return;
                }
            }

            // 清除选区
            window.getSelection()?.removeAllRanges();
            log('🎉 高亮应用完成！');
        }

        function clearAll() {
            const content = document.getElementById('content');
            content.innerHTML = `<h2>功能特色</h2>
<p>无边框窗口 - 沉浸式写作体验</p>
<p>实时自动保存 - 2秒无操作自动保存</p>
<p>聚焦模式 - 点击右上角靶心图标，专注当前段落</p>
<p>暗色主题 - 点击右上角月亮/太阳图标切换</p>`;
            document.getElementById('log').textContent = '';
            log('✨ 已清除所有高亮');
        }

        log('✨ 测试页面已加载，请选中文本后点击"应用高亮"');
    </script>
</body>
</html>
